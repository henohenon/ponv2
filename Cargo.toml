[package]
name = "pon"
version = "2.0.0"
edition = "2024"
description = "Zed の Markdown 向け：画像の貼り付け・改名と、名前からのページ作成"
build = "build.rs"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
pathdiff = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = "3"
clipboard-win = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
png = "0.18"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
